<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo catalogue</title><link rel="stylesheet" href="/static/style.css"><main><h1>Photo catalogue</h1><form method="post" enctype="multipart/form-data"><label>Title <input name="title" required></label><label>Photo <input name="photo" type="file" accept="image/png,image/jpeg" required></label><button>Save photo</button></form>{% for title,filename in photos %}<figure><img src="{{url_for('photo',name=filename)}}" alt="{{title}}" width="200"><figcaption>{{title}}</figcaption></figure>{% else %}<p>No photos yet.</p>{% endfor %}</main></html>
