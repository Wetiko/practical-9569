<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lost property</title><link rel="stylesheet" href="/static/style.css"><main><h1>Lost property</h1><form method="get"><label>Date <input name="day" type="date"></label><label>Category <select name="category"><option value="">All</option><option>Books</option><option>Clothing</option><option>Other</option></select></label><button>Search</button></form><ul>{% for row in rows %}<li>{{row.title}} — {{row.day}} — {{row.category}} — {{'Claimed' if row.claimed else 'Unclaimed'}}<form method="post" action="/claim/{{row.report_id}}"><button {% if row.claimed %}disabled{% endif %}>Mark claimed</button></form></li>{% else %}<li>No reports found.</li>{% endfor %}</ul><h2>Report an item</h2><form method="post"><label>Item <input name="title" required></label><label>Date lost <input name="day" type="date" required></label><label>Category <select name="category"><option>Books</option><option>Clothing</option><option>Other</option></select></label><button>Save report</button></form></main></html>
