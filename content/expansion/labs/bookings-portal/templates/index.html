<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookings</title><link rel="stylesheet" href="/static/style.css"><main><h1>Bookings</h1><form method="get"><label>Date <input name="day" type="date" value="{{day}}"></label><label>Category <input name="category" value="{{category}}"></label><button>Search</button></form><table><caption>Matching bookings</caption><thead><tr><th>Customer</th><th>Event</th><th>Date</th><th>Category</th><th>Quantity</th></tr></thead><tbody>{% for row in rows %}<tr>{% for value in row %}<td>{{value}}</td>{% endfor %}</tr>{% else %}<tr><td colspan="5">No bookings found.</td></tr>{% endfor %}</tbody></table><h2>Add a booking</h2><p>Customers: 1 Ari, 2 Mei. Events: 1 Robotics, 2 Pottery.</p><form method="post"><label>Customer ID <input name="customer" type="number" required></label><label>Event ID <input name="event" type="number" required></label><label>Quantity <input name="quantity" type="number" min="1" max="8" required></label><button>Add booking</button></form></main></html>
